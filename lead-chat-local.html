<!doctype html>
<html lang="en">
<head>

  <title>Lead Conversations · Prime Transfert</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #18242b; background: #d7dfdc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .top-band { position: fixed; inset: 0 0 auto; height: 124px; background: #086f62; }

    .brand-copy strong { display: block; font-size: 17px; line-height: 1.2; letter-spacing: -.03em; }
    .brand-copy span { display: block; margin-top: 2px; color: #72817c; font-size: 11px; letter-spacing: .015em; }
    .count { flex: none; padding: 5px 8px; border-radius: 6px; background: #e8f5ef; color: #087557; font-size: 12px; font-weight: 750; }
    .sidebar-title { margin: 26px 0 13px; font-size: 24px; letter-spacing: -.05em; line-height: 1.12; }
    .search { position: relative; display: flex; align-items: center; height: 42px; border-radius: 9px; background: #f1f4f3; color: #7d8985; }
    .search svg { margin-left: 13px; flex: none; }
    .search input { width: 100%; height: 100%; padding: 0 12px; border: 0; outline: 0; background: transparent; color: #24342e; font-size: 13px; }
    .search input::placeholder { color: #8a9691; }
    .filters { display: flex; gap: 7px; margin-top: 13px; }
    .filter { padding: 7px 11px; border: 1px solid #e2e9e5; border-radius: 7px; background: #fff; color: #66756e; font-size: 12px; font-weight: 650; }
    .filter.active { border-color: #bce1d3; background: #e8f6f0; color: #087658; }
    .sidebar-list { flex: 1; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #ccd8d2 transparent; }
    .lead { display: flex; align-items: center; width: 100%; gap: 12px; padding: 14px 17px 14px 20px; border: 0; border-bottom: 1px solid #f0f3f1; text-align: left; background: #fff; }
    .lead:hover { background: #f7faf8; }
    .lead.active { background: #e9f5ef; }
    .avatar { display: grid; place-items: center; width: 45px; height: 45px; flex: none; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 800; letter-spacing: -.02em; }
    .lead-content { min-width: 0; flex: 1; }
    .lead-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .lead-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 750; }
    .lead-market { flex: none; color: #88958e; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .lead-sub { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 5px; color: #75827d; font-size: 12px; }
    .sidebar-foot { padding: 11px 20px; border-top: 1px solid #e8eeea; color: #778680; background: #fcfdfc; font-size: 11px; line-height: 1.4; }
    .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #e8efeb; }
    .chat-head { z-index: 1; display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 12px 28px; border-bottom: 1px solid #dae4df; background: #f8faf8; }
    .back { display: none; border: 0; background: transparent; color: #50615a; font-size: 24px; line-height: 1; padding: 4px 6px 4px 0; }
    .chat-identity { min-width: 0; flex: 1; }
    .chat-identity strong { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; font-weight: 780; }
    .chat-identity span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 4px; font-size: 11px; color: #708079; }
    .profile-trigger { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
    .profile-trigger:hover .chat-identity strong { color: #087759; }
    .profile-trigger:focus-visible, .profile-close:focus-visible { outline: 2px solid #087759; outline-offset: 4px; }
    .profile-panel { position: absolute; z-index: 3; inset: 0 0 0 auto; width: min(420px, 100%); overflow: auto; padding: 25px; background: #fff; box-shadow: -12px 0 35px #203a3430; }
    .profile-panel[hidden] { display: none; }
    .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .profile-top h2 { margin: 0; font-size: 20px; }
    .profile-close { border: 0; background: #eef4f0; border-radius: 50%; width: 34px; height: 34px; font-size: 23px; color: #466156; }
    .profile-hero { display: flex; align-items: center; gap: 14px; padding-bottom: 24px; border-bottom: 1px solid #e5ece8; }
    .profile-hero .avatar { width: 56px; height: 56px; }
    .profile-hero strong { display: block; font-size: 18px; }
    .profile-hero span { display: block; margin-top: 4px; color: #72817c; font-size: 12px; }
    .profile-section { padding: 23px 0 0; }
    .profile-section h3 { margin: 0 0 9px; color: #087759; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; }
    .profile-section p { margin: 0; color: #33463d; font-size: 14px; line-height: 1.6; }
    .profile-section a { display: inline-block; margin-top: 10px; color: #087759; font-size: 13px; overflow-wrap: anywhere; }
    .profile-note { margin-top: 25px; padding: 12px; border-radius: 8px; background: #f4f7f5; color: #66766d; font-size: 12px; line-height: 1.5; }
    .outline-pill { flex: none; border: 1px solid #c5e4d7; color: #087759; background: #ecf8f1; border-radius: 100px; padding: 7px 10px; font-size: 11px; font-weight: 800; }
    .details { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 12px 31px; border-bottom: 1px solid #dce6df; background: #fff; font-size: 12px; }
    .details-item { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
    .details-label { color: #8a9891; font-weight: 650; }
    .details-value { color: #31453b; font-weight: 700; overflow-wrap: anywhere; }
    .details-link { margin-left: auto; color: #07795d; font-weight: 750; text-decoration: none; }
    .details-link:hover { text-decoration: underline; }
    .chat-body { flex: 1; min-height: 0; overflow: auto; padding: 24px max(26px, calc((100% - 840px) / 2)) 28px; background-color: #e8efeb; background-image: radial-gradient(#d6dfd8 0.65px, transparent 0.65px), radial-gradient(#f9f9f4 0.7px, transparent 0.7px); background-size: 20px 20px, 20px 20px; background-position: 0 0, 10px 10px; scrollbar-width: thin; }
    .notice { max-width: 600px; margin: 0 auto 25px; padding: 10px 16px; border-radius: 9px; background: #fff9e6; color: #706548; box-shadow: 0 1px 3px #40574c16; font-size: 12px; line-height: 1.5; text-align: center; }
    .date { width: max-content; margin: 0 auto 21px; padding: 7px 12px; border-radius: 7px; background: #f9fcf9; box-shadow: 0 1px 3px #40574c16; color: #66756d; font-size: 10px; font-weight: 760; letter-spacing: .07em; text-transform: uppercase; }
    .msg-row { display: flex; margin: 0 0 17px; }
    .msg-row.out { justify-content: flex-end; }
    .bubble { max-width: min(76%, 560px); padding: 10px 12px 9px; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px #41534b18; }
    .out .bubble { background: #d9f8df; border-top-right-radius: 2px; }
    .in .bubble { border-top-left-radius: 2px; }
    .bubble-label { margin: 0 0 8px; color: #087961; font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .in .bubble-label { color: #75847b; }
    .cn { margin: 0; color: #1c2b24; font-size: 14px; line-height: 1.6; }
    .translation { margin: 9px 0 0; padding-top: 8px; border-top: 1px solid #5c8c681c; color: #4f7871; font-size: 12px; line-height: 1.5; }
    .in .translation { color: #617a87; border-top-color: #607e891a; }
    .time { display: flex; justify-content: flex-end; gap: 4px; margin-top: 6px; color: #81928a; font-size: 10px; }
    .ticks { color: #40a78e; font-weight: 800; letter-spacing: -.14em; }
    .composer { display: flex; align-items: center; gap: 12px; min-height: 73px; padding: 12px 24px; border-top: 1px solid #dce6df; background: #f6f8f6; }
    .composer-note { min-width: 0; flex: 1; padding: 12px 16px; border: 1px solid #e0e8e2; border-radius: 9px; background: #fff; color: #84918a; font-size: 12px; }
    .copy { display: flex; align-items: center; justify-content: center; gap: 8px; flex: none; min-width: 126px; height: 42px; padding: 0 14px; border: 0; border-radius: 9px; background: #0b8063; color: #fff; font-size: 12px; font-weight: 760; }
    .copy:hover { background: #086b55; }
    .empty { padding: 24px; color: #84928b; font-size: 13px; }
    @media (max-width: 840px) { .app { width: 100%; height: 100dvh; min-height: 0; margin: 0; border-radius: 0; } .details { gap: 10px 16px; padding: 10px 20px; } .details-link { margin-left: 0; } .chat-head { padding: 12px 20px; } }
    @media (max-width: 660px) { .top-band { display: none; } .app { display: block; } .sidebar, .chat { width: 100%; height: 100%; } .chat { display: none; } .app.mobile-chat .sidebar { display: none; } .app.mobile-chat .chat { display: flex; } .back { display: block; } .chat-head { min-height: 65px; padding: 9px 15px; } .chat-head .avatar { width: 39px; height: 39px; } .chat-body { padding: 20px 14px; } .bubble { max-width: 87%; } .details { padding: 10px 15px; gap: 6px 13px; } .details-item { font-size: 11px; } .composer { padding: 10px 12px; } .copy { min-width: 112px; } .sidebar-head { padding-top: 21px; } }
  </style>
</head>
<body>
  <div class="top-band"></div>
  <main class="app" id="app">
    <aside class="sidebar" aria-label="Lead chats">
      <div class="sidebar-head">

        <div class="filters" role="group" aria-label="Filter by market"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="Mainland China">Mainland China</button><button class="filter" data-filter="Hong Kong">Hong Kong</button></div>

  </main>

      { id:"huanyao", name:"Beijing Huanyao", zh:"北京环耀", market:"Mainland China", city:"Beijing", type:"BYD dealer group", phone:"+86 10 8491 2569", email:"huanyaocar@126.com", source:"https://dealer.xcar.com.cn/44275/about.htm", initials:"HY", color:"#4379a5", route:"北京各展厅与4S店", routeEn:"Beijing showrooms and full-service dealerships", reply:"我们通常自己安排。你们是想承接临时调车吗？", replyEn:"We usually arrange it ourselves. Are you offering help with occasional car moves?" },

    const profiles = {
      harmony: { about:"Harmony Auto is an automotive group with a Hong Kong office. Its public site lists an office phone number and email, but no named vehicle logistics contact.", evidence:"Harmony Auto company page and Hong Kong office details", why:"Its dealer operations may need individual cars moved between sales, service, and delivery locations. Ask the office who manages those moves." },

      xpeng: { about:"XPENG Hong Kong announced a Wan Chai showroom on its public site. This is a company contact lead; no individual logistics contact is verified.", evidence:"XPENG Hong Kong showroom announcement", why:"A showroom creates possible vehicle delivery and transfer needs. Ask who manages handovers and movement between sites." },
      dongfeng: { about:"Dongfeng Hong Kong lists a Yuen Long experience centre, a Kowloon Bay showroom, and several service centres. No named transport contact is shown.", evidence:"Dongfeng Hong Kong locations and contact details", why:"Its multiple public locations make short-distance car moves a plausible need. Start by asking who coordinates these moves." },
      gaholdings: { about:"G.A. Holdings is listed here as an automotive distributor operating across Hong Kong and mainland China. The linked contact page is the current source; no named logistics contact is verified.", evidence:"G.A. Holdings contact page", why:"A distributor may coordinate cars across dealers and service locations. Confirm its exact routes and whether it buys transport services." },
      zungfu: { about:"Zung Fu Group represents several passenger and commercial vehicle brands in Hong Kong and Macau, including Mercedes-Benz, DENZA, smart, and Hyundai. No named logistics contact is verified.", evidence:"Zung Fu Group business and contact page", why:"Multiple brands and sales and after-sales services may create regular vehicle movement needs. Find the team responsible for delivery operations." },
      bydhk: { about:"BYD Hong Kong provides a public company contact route. This record is for the business, and no named person responsible for vehicle transport has been verified.", evidence:"BYD Hong Kong contact page", why:"A manufacturer office may be able to direct a transport proposal to its dealer or delivery operations team. Confirm the right buyer before pitching." }
    };
    const app = document.getElementById("app");
    const list = document.getElementById("leadList");
    const body = document.getElementById("chatBody");
    const search = document.getElementById("search");
    let selected = leads[0];
    let filter = "all";
    document.getElementById("leadCount").textContent = leads.length + " leads";
    const esc = (v) => String(v).replace(/[&<>\"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const initials = (lead) => `<span class="avatar" style="background:${lead.color}">${esc(lead.initials)}</span>`;
    function conversation(lead) {
      if (lead.market === "Hong Kong") return [
        { side:"out", cn:`您好，我們正在研究為${lead.zh}這類汽車企業提供單車調撥和交付服務。想請教：在${lead.route}之間移動車輛，通常由哪個團隊安排？`, en:`Hello, we are exploring an individual car transfer and delivery service for automotive businesses like ${lead.name}. Which team usually arranges vehicle moves between ${lead.routeEn}?` },
        { side:"in", cn:lead.reply, en:lead.replyEn },
        { side:"out", cn:"我們設想由專業司機取車、拍照記錄車況，並在交車前提供進度更新。想先了解您們目前最常遇到哪類單車移動需求。", en:"The proposed service would use a professional driver, photo records of the car's condition, and progress updates before handover. I would first like to learn which individual car moves you need most often." },
        { side:"in", cn:"偶爾需要在據點之間調車，也會有客戶交付。你們可以先發一份簡介嗎？", en:"We occasionally move cars between locations and deliver to customers. Could you send a short overview?" },
        { side:"out", cn:"當然可以。我會準備一頁簡介。方便的話，能否介紹負責車輛調撥或交付的同事？我們可以按實際路線討論小規模試點。", en:"Of course. I can prepare a one-page overview. Could you introduce the person responsible for vehicle moves or deliveries? We can discuss a small pilot using real routes." }
      ];
      return [
        { side:"out", cn:`您好，我们正在研究为${lead.zh}这类汽车企业提供单车调拨和交付服务。想请教：在${lead.route}之间移动车辆，通常由哪个团队安排？`, en:`Hello, we are exploring an individual car transfer and delivery service for automotive businesses like ${lead.name}. Which team usually arranges vehicle moves between ${lead.routeEn}?` },
        { side:"in", cn:lead.reply, en:lead.replyEn },
        { side:"out", cn:"我们设想由专业司机取车、拍照记录车况，并在交车前提供进度更新。想先了解贵司目前最常遇到哪类单车移动需求。", en:"The proposed service would use a professional driver, photo records of the car's condition, and progress updates before handover. I would first like to learn which individual car moves you need most often." },
        { side:"in", cn:"偶尔需要门店之间调车，也会有客户交付。你们可以先发一份简介吗？", en:"We occasionally move cars between stores and deliver to customers. Could you send a short overview?" },
        { side:"out", cn:"当然可以。我会准备一页简介。方便的话，能否介绍负责车辆调拨或交付的同事？我们可以按实际路线讨论小规模试点。", en:"Of course. I can prepare a one-page overview. Could you introduce the person responsible for vehicle moves or deliveries? We can discuss a small pilot using real routes." }
      ];
    }
    function renderList() {
      const query = search.value.trim().toLowerCase();
      const shown = leads.filter((lead) => (filter === "all" || lead.market === filter) && `${lead.name} ${lead.zh} ${lead.city} ${lead.type}`.toLowerCase().includes(query));
      list.innerHTML = shown.length ? shown.map((lead) => `<button class="lead ${lead.id === selected.id ? "active" : ""}" data-id="${lead.id}" aria-current="${lead.id === selected.id ? "true" : "false"}">${initials(lead)}<span class="lead-content"><span class="lead-top"><span class="lead-name">${esc(lead.name)}</span><span class="lead-market">${lead.market === "Hong Kong" ? "HK" : "CN"}</span></span><span class="lead-sub">${esc(lead.type)} · ${esc(lead.city)}</span></span></button>`).join("") : `<div class="empty">No leads found.</div>`;
      list.querySelectorAll(".lead").forEach((button) => button.addEventListener("click", () => { selected = leads.find((lead) => lead.id === button.dataset.id); closeProfile(); renderList(); renderChat(); app.classList.add("mobile-chat"); }));
    }
    function renderChat() {
      const lead = selected;
      document.getElementById("chatAvatar").replaceWith(Object.assign(document.createElement("div"), { id:"chatAvatar", className:"avatar", textContent:lead.initials }));
      document.getElementById("chatAvatar").style.background = lead.color;
      document.getElementById("chatName").textContent = lead.name;
      document.getElementById("chatSubtitle").textContent = `${lead.type} · ${lead.city}`;
      document.getElementById("details").innerHTML = `<span class="details-item"><span class="details-label">Phone</span><span class="details-value">${esc(lead.phone)}</span></span>${lead.email ? `<span class="details-item"><span class="details-label">Email</span><span class="details-value">${esc(lead.email)}</span></span>` : ""}<a class="details-link" href="${esc(lead.source)}" target="_blank" rel="noopener noreferrer">Verify contact ↗</a>`;
      body.innerHTML = `<div class="notice">These are imagined conversations for planning outreach. Replies are examples, not statements from these companies.</div><div class="date">Conversation preview</div>` + conversation(lead).map((msg, index) => `<div class="msg-row ${msg.side}"><div class="bubble"><div class="bubble-label">${msg.side === "out" ? "Suggested message" : "Possible reply"}</div><p class="cn" lang="${lead.market === "Hong Kong" ? "zh-Hant" : "zh-Hans"}">${esc(msg.cn)}</p><p class="translation" lang="en">${esc(msg.en)}</p><div class="time">${String(9 + Math.floor(index / 2)).padStart(2,"0")}:${index % 2 ? "02" : "00"}${msg.side === "out" ? `<span class="ticks">✓✓</span>` : ""}</div></div></div>`).join("");
      body.scrollTop = 0;
    }
    function renderProfile() {
      const lead = selected;
      const profile = profiles[lead.id];
      document.getElementById("profileContent").innerHTML = `<div class="profile-hero">${initials(lead)}<div><strong>${esc(lead.name)}</strong><span>${esc(lead.type)} · ${esc(lead.city)}</span></div></div><section class="profile-section"><h3>About this lead</h3><p>${esc(profile.about)}</p><a href="${esc(lead.source)}" target="_blank" rel="noopener noreferrer">Evidence: ${esc(profile.evidence)} ↗</a></section><section class="profile-section"><h3>Why this lead interests us</h3><p>${esc(profile.why)}</p></section><div class="profile-note">This is a company lead. A named person and their role still need to be confirmed. The reason for interest is a possible opportunity, not a confirmed transport need.</div>`;
    }
    function closeProfile() {
      document.getElementById("profilePanel").hidden = true;
      document.getElementById("profileTrigger").setAttribute("aria-expanded", "false");
    }
    document.getElementById("profileTrigger").addEventListener("click", () => {
      renderProfile();
      document.getElementById("profilePanel").hidden = false;
      document.getElementById("profileTrigger").setAttribute("aria-expanded", "true");
      document.getElementById("profileClose").focus();
    });
    document.getElementById("profileClose").addEventListener("click", () => { closeProfile(); document.getElementById("profileTrigger").focus(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape" && !document.getElementById("profilePanel").hidden) { closeProfile(); document.getElementById("profileTrigger").focus(); } });
    document.querySelectorAll(".filter").forEach((button) => button.addEventListener("click", () => { filter = button.dataset.filter; document.querySelectorAll(".filter").forEach((item) => item.classList.toggle("active", item === button)); renderList(); }));
    search.addEventListener("input", renderList);
    document.getElementById("back").addEventListener("click", () => app.classList.remove("mobile-chat"));
    document.getElementById("copy").addEventListener("click", async () => { const button = document.getElementById("copy"); try { await navigator.clipboard.writeText(conversation(selected)[0].cn); button.textContent = "Copied!"; setTimeout(() => button.textContent = "Copy first message", 1600); } catch { button.textContent = "Copy unavailable"; setTimeout(() => button.textContent = "Copy first message", 1600); } });
    renderList(); renderChat();
  </script>
</body>
</html>
